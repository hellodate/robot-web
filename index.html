<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="拓恩普自动化测试系统 - Web 管理端" />
    <title>%VITE_APP_TITLE%</title>
    <style>
      /* 首屏加载占位（Vue 挂载前） */
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3f4f6;
        font-family: 'Microsoft YaHei', sans-serif;
        color: #6b7280;
        font-size: 14px;
      }
      #app-loading .spinner {
        width: 32px;
        height: 32px;
        margin-right: 12px;
        border: 3px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading">
        <div class="spinner"></div>
        <span>正在加载…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
